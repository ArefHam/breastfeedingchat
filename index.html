<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دستیار تغذیه نوزاد — سیستم هوشمند مشاوره شیردهی</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=Lalezar&family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1:#fff5f1;
      --bg-2:#fdf2f8;
      --bg-3:#f0fbf4;
      --card:#ffffff;
      --text:#3b2c3a;
      --muted:#8a7a86;
      --brand:#ec8a9e;       /* soft rose */
      --brand-2:#f5b187;     /* warm peach */
      --accent:#9dd3b8;      /* sage */
      --accent-2:#c4b5fd;    /* gentle lavender */
      --line:#f1e2e7;
      --bubble-user:#fde4ec;
      --bubble-user-border:#fbcfe1;
      --bubble-bot:#ffffff;
      --bubble-bot-border:#fde7d4;
      --shadow:0 12px 32px rgba(236,138,158,.18);
    }
    html, body { height:100%; }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:'Vazirmatn','Quicksand',sans-serif;
      background:
        radial-gradient(1200px 600px at 90% -10%, #ffe4ec 0%, transparent 60%),
        radial-gradient(900px 500px at -10% 110%, #e7f7ee 0%, transparent 55%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color:var(--text);
      direction:rtl;
      overflow:hidden;
    }
    body[dir="ltr"] { font-family:'Nunito','Quicksand',sans-serif; }

    .chat-container {
      width:min(960px,94vw);
      height:calc(100vh - 28px);
      margin:14px auto;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      display:flex;
      flex-direction:column;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    /* ── Header (sticky inside container) ── */
    .chat-header {
      flex-shrink:0;
      padding:16px 20px;
      background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 60%,#fcd5b4 100%);
      color:#fff;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      position:relative;
    }
    .chat-header::after {
      content:"";
      position:absolute; left:0; right:0; bottom:-1px; height:18px;
      background:radial-gradient(circle at 20px 0, transparent 12px, var(--card) 13px) repeat-x;
      background-size:40px 18px;
      opacity:0;
    }
    .header-title-group { display:flex; align-items:center; gap:14px; }
    .header-icon-wrap {
      width:48px; height:48px; border-radius:50%;
      background:rgba(255,255,255,.25);
      display:flex; align-items:center; justify-content:center;
      box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
      flex-shrink:0;
    }
    .header-icon-wrap i { font-size:24px; }
    .header-title-text h1 {
      margin:0; font-size:24px;
      font-family:'Lalezar','Quicksand',sans-serif;
      font-weight:600; line-height:1.25; letter-spacing:.3px;
    }
    body[dir="ltr"] .header-title-text h1 { font-family:'Quicksand','Nunito',sans-serif; font-weight:700; }
    .header-subtitle { margin:3px 0 0; font-size:13px; opacity:.95; font-weight:400; }
    .header-ai-badge {
      font-size:11px; font-weight:500;
      background:rgba(255,255,255,.22);
      border:1px solid rgba(255,255,255,.4);
      border-radius:999px; padding:3px 10px;
      margin-top:6px; display:inline-block; letter-spacing:.5px;
    }
    .header-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .header-status {
      font-size:12px; display:flex; align-items:center; gap:6px;
      background:rgba(255,255,255,.18); border-radius:999px;
      padding:5px 12px; white-space:nowrap;
    }
    .status-dot { width:8px; height:8px; border-radius:50%; background:#bef264; box-shadow:0 0 8px rgba(190,242,100,.9); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .lang-toggle {
      background:rgba(255,255,255,.2);
      border:1px solid rgba(255,255,255,.4);
      color:#fff; font-family:inherit; font-size:12px; font-weight:600;
      padding:6px 12px; border-radius:999px; cursor:pointer;
      transition:background .15s;
    }
    .lang-toggle:hover { background:rgba(255,255,255,.32); }

    /* ── Quick actions (sticky under header) ── */
    .quick-actions {
      flex-shrink:0;
      display:flex; flex-wrap:wrap; gap:8px;
      padding:12px 16px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#fff7f3,#fff);
    }
    .quick-btn {
      border:1px solid #f7d3c4; background:#fff; color:#7b3a4d;
      font-size:14px; padding:8px 14px; border-radius:999px;
      cursor:pointer; font-family:inherit;
      transition:all .15s;
      box-shadow:0 2px 6px rgba(236,138,158,.08);
    }
    .quick-btn:hover { border-color:var(--brand); background:#fde4ec; color:#9a2747; transform:translateY(-1px); }

    /* ── Chat box (the only scroll area) ── */
    .chat-box {
      flex:1; min-height:0;
      padding:18px;
      overflow-y:auto; overflow-x:hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(253,228,236,.5) 0, transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(231,247,238,.5) 0, transparent 30%),
        #fffaf7;
      display:flex; flex-direction:column; gap:12px;
      scroll-behavior:smooth;
    }
    .chat-box::-webkit-scrollbar { width:8px; }
    .chat-box::-webkit-scrollbar-thumb { background:#f5cdd9; border-radius:4px; }
    .chat-box::-webkit-scrollbar-track { background:transparent; }

    .welcome-message {
      border:1px solid #f9d6e1; background:linear-gradient(135deg,#fff5f8,#fdf2f8);
      border-radius:18px; padding:18px;
      font-size:16px; line-height:1.9;
      display:flex; gap:12px; align-items:flex-start;
    }
    .welcome-message i { color:var(--brand); font-size:22px; flex-shrink:0; margin-top:2px; }

    .message {
      max-width:78%;
      padding:13px 16px;
      border-radius:18px;
      line-height:1.9;
      font-size:15px;
      position:relative;
      animation:fadeIn .25s ease-out;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:none;} }

    .user-message {
      align-self:flex-start;
      background:var(--bubble-user);
      border:1px solid var(--bubble-user-border);
      border-bottom-right-radius:6px;
      white-space:pre-wrap;
      color:#5b1f3b;
    }
    body[dir="ltr"] .user-message {
      align-self:flex-end;
      border-bottom-right-radius:18px;
      border-bottom-left-radius:6px;
    }
    .bot-message {
      align-self:flex-end;
      background:var(--bubble-bot);
      border:1px solid var(--bubble-bot-border);
      border-bottom-left-radius:6px;
      box-shadow:0 4px 12px rgba(245,177,135,.10);
    }
    body[dir="ltr"] .bot-message {
      align-self:flex-start;
      border-bottom-left-radius:18px;
      border-bottom-right-radius:6px;
    }
    .bot-message ul { margin:6px 0 6px 0; padding-inline-start:20px; }
    .bot-message li { margin:3px 0; }
    .bot-message h4 { margin:8px 0 4px; font-size:15px; color:var(--brand); }
    .message-time { margin-top:8px; font-size:11px; color:var(--muted); }

    /* ── Typing indicator ── */
    .typing-indicator {
      align-self:flex-end;
      background:#fff; border:1px solid var(--bubble-bot-border);
      border-radius:18px; border-bottom-left-radius:6px;
      padding:10px 14px; display:flex; align-items:center; gap:10px;
      font-size:14px; color:var(--muted);
    }
    body[dir="ltr"] .typing-indicator { align-self:flex-start; border-bottom-left-radius:18px; border-bottom-right-radius:6px; }
    .typing-dots span {
      width:7px; height:7px; border-radius:50%;
      background:var(--brand); display:inline-block;
      animation:bounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2){ animation-delay:.15s; }
    .typing-dots span:nth-child(3){ animation-delay:.3s; }
    @keyframes bounce { 0%,80%,100% { transform:translateY(0); opacity:.6; } 40% { transform:translateY(-5px); opacity:1; } }

    /* ── Input area (sticky bottom) ── */
    .input-area {
      flex-shrink:0;
      display:flex; gap:10px; padding:14px;
      border-top:1px solid var(--line);
      background:linear-gradient(0deg,#fff7f3,#fff);
    }
    input[type="text"] {
      flex:1; border:1.5px solid #f3d2dc; border-radius:14px;
      font-size:16px; padding:12px 16px; font-family:inherit;
      outline:none; background:#fff;
      transition:border-color .2s, box-shadow .2s;
    }
    input[type="text"]:focus { border-color:var(--brand); box-shadow:0 0 0 4px rgba(236,138,158,.15); }
    button {
      border:none; border-radius:14px; font-family:inherit; font-size:15px;
      padding:12px 18px; cursor:pointer; transition:transform .1s, opacity .2s, box-shadow .2s;
      font-weight:600;
    }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button:not(:disabled):hover { transform:translateY(-1px); }
    #send-btn {
      background:linear-gradient(135deg,var(--brand),var(--brand-2));
      color:#fff;
      box-shadow:0 6px 14px rgba(236,138,158,.35);
    }
    #clear-btn {
      background:#fff; color:#b56270; border:1.5px solid #f3d2dc;
    }

    /* ── Footer ── */
    .footer-info {
      flex-shrink:0;
      border-top:1px solid var(--line); padding:10px 14px;
      font-size:13px; color:var(--muted);
      display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
      background:#fffaf8;
    }
    .dev-only { opacity:.75; }
    body.screenshot-mode .dev-only { display:none !important; }

    /* ── Print / screenshot ── */
    @media print {
      body { background:white !important; overflow:visible !important; }
      .quick-actions, .input-area, .footer-info { display:none !important; }
      .chat-container { box-shadow:none !important; max-width:100% !important; margin:0 !important; height:auto !important; }
      .chat-box { height:auto !important; overflow:visible !important; }
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .chat-container { margin:0; height:100vh; border-radius:0; width:100%; }
      .message { max-width:90%; }
      .input-area { flex-wrap:wrap; }
      #send-btn, #clear-btn { flex:1; }
      .header-subtitle { display:none; }
      .header-title-text h1 { font-size:20px; }
      .header-icon-wrap { width:40px; height:40px; }
      .header-icon-wrap i { font-size:20px; }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="header-title-group">
        <div class="header-icon-wrap"><i class="fas fa-baby"></i></div>
        <div class="header-title-text">
          <h1 data-i18n="title">دستیار تغذیه نوزاد</h1>
          <div class="header-subtitle" data-i18n="subtitle">راهنمای هوشمند شیردهی و تغذیه نوزاد مبتنی بر شواهد علمی</div>
          <div class="header-ai-badge" data-i18n="aiBadge">⚡ Powered by AI</div>
        </div>
      </div>
      <div class="header-right">
        <button class="lang-toggle" id="lang-toggle" title="Switch language">EN</button>
        <div class="header-status">
          <span class="status-dot"></span>
          <span data-i18n="online">آنلاین</span>
        </div>
      </div>
    </div>

    <div class="quick-actions dev-only">
      <button class="quick-btn" data-q-key="q1" data-i18n="q1Label">کفایت شیر مادر در ۴ ماهگی</button>
      <button class="quick-btn" data-q-key="q2" data-i18n="q2Label">افزایش تولید شیر</button>
      <button class="quick-btn" data-q-key="q3" data-i18n="q3Label">علائم کافی بودن شیر</button>
    </div>

    <div id="chat-box" class="chat-box">
      <div class="welcome-message">
        <i class="fas fa-heart"></i>
        <span dir="auto" data-i18n="welcome">سلام. این محیط برای پشتیبانی از مادران در زمینه شیردهی طراحی شده است. لطفاً پرسش خود را به‌صورت دقیق بنویسید تا پاسخ متناسب دریافت کنید.</span>
      </div>
    </div>

    <div class="input-area">
      <input id="user-input" type="text" dir="auto" data-i18n-placeholder="placeholder" placeholder="سوال خود را درباره شیردهی یا تغذیه نوزاد بنویسید..." />
      <button id="send-btn" data-i18n="send">ارسال</button>
      <button id="clear-btn" data-i18n="clear">پاک‌کردن</button>
    </div>

    <div class="footer-info">
      <div data-i18n="privacy">🔒 حفظ محرمانگی گفتگو</div>
      <div data-i18n="connected">🟢 اتصال به وب‌هوک فعال</div>
    </div>
  </div>

<script>
  const N8N_URL = "https://n8n.eveai.cloud/webhook/1b006acc-f062-4f5f-ab6b-99185f903b75";
  const DEMO_MODE = new URLSearchParams(location.search).get("demo") === "true";
  const SCREENSHOT_MODE = new URLSearchParams(location.search).get("screenshot") === "true";
  if (SCREENSHOT_MODE) document.body.classList.add("screenshot-mode");

  // ── i18n ──
  const I18N = {
    fa: {
      title: "دستیار تغذیه نوزاد",
      subtitle: "راهنمای هوشمند شیردهی و تغذیه نوزاد مبتنی بر شواهد علمی",
      aiBadge: "⚡ مبتنی بر هوش مصنوعی",
      online: "آنلاین",
      q1Label: "کفایت شیر مادر در ۴ ماهگی",
      q2Label: "افزایش تولید شیر",
      q3Label: "علائم کافی بودن شیر",
      q1: "آیا شیر مادر برای نوزاد ۴ ماهه کافی است؟",
      q2: "چطور می‌توانم شیر بیشتری تولید کنم؟",
      q3: "علائم کافی بودن شیر مادر چیست؟",
      welcome: "سلام. این محیط برای پشتیبانی از مادران در زمینه شیردهی طراحی شده است. لطفاً پرسش خود را به‌صورت دقیق بنویسید تا پاسخ متناسب دریافت کنید.",
      placeholder: "سوال خود را درباره شیردهی یا تغذیه نوزاد بنویسید...",
      send: "ارسال",
      clear: "پاک‌کردن",
      privacy: "🔒 حفظ محرمانگی گفتگو",
      connected: "🟢 اتصال به وب‌هوک فعال",
      typing: "در حال دریافت پاسخ",
      noAnswer: "پاسخی دریافت نشد.",
      networkError: "ارتباط با سرویس پاسخ‌گویی برقرار نشد. لطفاً دوباره تلاش کنید.",
      cleared: "گفتگو پاک شد. می‌توانید از ابتدا سوال بپرسید.",
      langBtn: "EN"
    },
    en: {
      title: "Infant Feeding Assistant",
      subtitle: "Evidence-based smart guide for breastfeeding & infant nutrition",
      aiBadge: "⚡ Powered by AI",
      online: "Online",
      q1Label: "Is breast milk enough at 4 months?",
      q2Label: "Increasing milk supply",
      q3Label: "Signs of sufficient milk",
      q1: "Is breast milk alone enough for a 4-month-old baby?",
      q2: "How can I increase my milk supply?",
      q3: "What are the signs that my baby is getting enough milk?",
      welcome: "Hello. This space is designed to support mothers with breastfeeding questions. Please write your question clearly so we can give you a tailored answer.",
      placeholder: "Ask a question about breastfeeding or infant nutrition...",
      send: "Send",
      clear: "Clear",
      privacy: "🔒 Conversation is private",
      connected: "🟢 Connected",
      typing: "Generating response",
      noAnswer: "No response received.",
      networkError: "Could not reach the assistant service. Please try again.",
      cleared: "Conversation cleared. You can start asking again.",
      langBtn: "FA"
    }
  };

  let currentLang = localStorage.getItem("eveai_lang") || "fa";

  function applyLang(lang) {
    currentLang = lang;
    localStorage.setItem("eveai_lang", lang);
    const dict = I18N[lang];
    document.documentElement.lang = lang === "fa" ? "fa" : "en";
    document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
    document.body.dir = lang === "fa" ? "rtl" : "ltr";
    document.title = dict.title + (lang === "fa" ? " — سیستم هوشمند مشاوره شیردهی" : " — Smart Breastfeeding Support");
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (dict[key] !== undefined) el.textContent = dict[key];
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
      const key = el.getAttribute("data-i18n-placeholder");
      if (dict[key] !== undefined) el.placeholder = dict[key];
    });
    document.querySelectorAll(".quick-btn").forEach(btn => {
      const qk = btn.getAttribute("data-q-key");
      if (dict[qk]) btn.dataset.question = dict[qk];
    });
    document.getElementById("lang-toggle").textContent = dict.langBtn;
  }

  document.getElementById("lang-toggle").addEventListener("click", () => {
    applyLang(currentLang === "fa" ? "en" : "fa");
  });

  const chatBox = document.getElementById("chat-box");
  const sendBtn = document.getElementById("send-btn");
  const clearBtn = document.getElementById("clear-btn");
  const input = document.getElementById("user-input");

  function time() {
    const t = new Date();
    return `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  }

  function getSessionId() {
    let id = localStorage.getItem("eveai_sessionId");
    if (!id) {
      id = crypto?.randomUUID?.() || `${Date.now()}_${Math.random().toString(16).slice(2)}`;
      localStorage.setItem("eveai_sessionId", id);
    }
    return id;
  }

  function renderMarkdown(text) {
    const lines = text.split('\n');
    const out = [];
    let inList = false;
    for (const line of lines) {
      const trimmed = line.trim();
      const bold = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if (trimmed.startsWith('- ')) {
        if (!inList) { out.push('<ul>'); inList = true; }
        out.push(`<li>${bold(trimmed.slice(2))}</li>`);
      } else {
        if (inList) { out.push('</ul>'); inList = false; }
        if (trimmed.startsWith('### ')) {
          out.push(`<h4>${bold(trimmed.slice(4))}</h4>`);
        } else if (trimmed === '') {
          out.push('<br>');
        } else {
          out.push(`<span>${bold(trimmed)}</span><br>`);
        }
      }
    }
    if (inList) out.push('</ul>');
    return out.join('');
  }

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = `message ${role === 'user' ? 'user-message' : 'bot-message'}`;
    div.setAttribute("dir", "auto");
    if (role === 'assistant') {
      div.innerHTML = renderMarkdown(text);
    } else {
      div.textContent = text;
    }
    const ts = document.createElement("div");
    ts.className = "message-time";
    ts.textContent = time();
    div.appendChild(ts);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function addTyping() {
    const el = document.createElement("div");
    el.className = "typing-indicator";
    const label = I18N[currentLang].typing;
    el.innerHTML = `<span>${label}</span><span class="typing-dots"><span></span><span></span><span></span></span>`;
    chatBox.appendChild(el);
    chatBox.scrollTop = chatBox.scrollHeight;
    return el;
  }

  function seedDemoConversation() {
    const isFa = currentLang === "fa";
    if (isFa) {
      addMessage("آیا شیر مادر برای نوزاد ۴ ماهه کافی است؟", "user");
      addMessage(
        "بله، در بیشتر موارد تا پایان ۶ ماهگی، **شیر مادر به‌تنهایی کافی است**؛ به شرطی که افزایش وزن، تعداد پوشک خیس و رشد نوزاد مناسب باشد.\n" +
        "\n### نکات کلیدی ارزیابی\n" +
        "- پایش وزن ماهانه و مقایسه با منحنی‌های رشد WHO\n" +
        "- تعداد پوشک خیس: حداقل ۶ پوشک در شبانه‌روز\n" +
        "- دفعات شیردهی: ۸ تا ۱۲ بار در ۲۴ ساعت\n" +
        "- علائم سیری پس از شیردهی و خواب منظم\n" +
        "\nدر صورت نگرانی درباره رشد، ارزیابی حضوری توسط پزشک یا **مشاور رسمی شیردهی (IBCLC)** توصیه می‌شود.\n" +
        "\n### منابع / References\n" +
        "- WHO/UNICEF (2022). *Breastfeeding and Infant Feeding Guidelines*\n" +
        "- AAP Policy Statement on Breastfeeding, 2022",
        "assistant"
      );
      addMessage("چطور میتوانم شیر بیشتری تولید کنم؟", "user");
      addMessage(
        "تولید شیر مادر بر اساس اصل **«عرضه و تقاضا»** تنظیم می‌شود. مؤثرترین راهکارها:\n" +
        "\n### روش‌های افزایش تولید\n" +
        "- **شیردهی مکرر**: ۸ تا ۱۲ بار در شبانه‌روز، از جمله شبانه\n" +
        "- **تخلیه کامل پستان** در هر نوبت (پمپ کردن پس از شیردهی در صورت نیاز)\n" +
        "- تماس **پوست‌به‌پوست** با نوزاد برای تحریک هورمون اکسی‌توسین\n" +
        "- مصرف حداقل **۲ تا ۲.۵ لیتر آب** در روز\n" +
        "- **استراحت کافی** و کاهش استرس\n" +
        "\n### علائم نیازمند ارزیابی فوری\n" +
        "- کاهش وزن نوزاد بیش از ۱۰٪ از وزن تولد\n" +
        "- تب، درد شدید یا سفتی پستان\n" +
        "- کمتر از ۶ پوشک خیس در روز\n" +
        "\n### منابع / References\n" +
        "- Academy of Breastfeeding Medicine Protocol #9: Use of Galactogogues\n" +
        "- راهنمای بالینی مدیریت کم‌شیری، وزارت بهداشت ۱۴۰۲",
        "assistant"
      );
    } else {
      addMessage("Is breast milk alone enough for a 4-month-old baby?", "user");
      addMessage(
        "Yes — in most cases, **breast milk alone is sufficient** until 6 months of age, provided that weight gain, wet diapers, and overall growth are appropriate.\n" +
        "\n### Key indicators\n" +
        "- Monthly weight monitoring against WHO growth curves\n" +
        "- At least **6 wet diapers** in 24 hours\n" +
        "- **8–12 feeds** per 24 hours\n" +
        "- Visible satiety after feeds and regular sleep cycles\n" +
        "\nIf you have concerns about growth, an in-person assessment by a pediatrician or a certified **lactation consultant (IBCLC)** is recommended.\n" +
        "\n### References\n" +
        "- WHO/UNICEF (2022). *Breastfeeding and Infant Feeding Guidelines*\n" +
        "- AAP Policy Statement on Breastfeeding, 2022",
        "assistant"
      );
      addMessage("How can I increase my milk supply?", "user");
      addMessage(
        "Milk supply follows a **supply-and-demand** principle. The most effective strategies are:\n" +
        "\n### Ways to boost production\n" +
        "- **Frequent feeding**: 8–12 times per 24 hours, including overnight\n" +
        "- **Full breast emptying** at each feed (pump after if needed)\n" +
        "- **Skin-to-skin contact** to stimulate oxytocin release\n" +
        "- Drink at least **2–2.5 L of water** daily\n" +
        "- **Adequate rest** and stress reduction\n" +
        "\n### When to seek urgent evaluation\n" +
        "- Baby's weight loss greater than 10% of birth weight\n" +
        "- Fever, severe pain, or breast hardness\n" +
        "- Fewer than 6 wet diapers per day\n" +
        "\n### References\n" +
        "- Academy of Breastfeeding Medicine Protocol #9: Use of Galactogogues\n" +
        "- Ministry of Health Clinical Guideline on Low Milk Supply, 2023",
        "assistant"
      );
    }
  }

  let isSending = false;
  async function send() {
    if (isSending) return;
    const msg = input.value.trim();
    if (!msg) return;
    addMessage(msg, "user");
    input.value = "";
    const typing = addTyping();

    isSending = true;
    sendBtn.disabled = true;
    input.disabled = true;

    try {
      const res = await fetch(N8N_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ msg, sessionId: getSessionId(), lang: currentLang })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      typing.remove();
      addMessage(data?.answer || I18N[currentLang].noAnswer, "assistant");
    } catch (err) {
      typing.remove();
      addMessage(I18N[currentLang].networkError, "assistant");
      console.error(err);
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  clearBtn.onclick = () => {
    chatBox.innerHTML = "";
    localStorage.removeItem("eveai_sessionId");
    addMessage(I18N[currentLang].cleared, "assistant");
  };
  sendBtn.onclick = send;
  input.onkeydown = (e) => { if (e.key === "Enter") send(); };
  document.querySelectorAll(".quick-btn").forEach(btn => btn.onclick = () => { input.value = btn.dataset.question; send(); });

  // Initial language application
  applyLang(currentLang);

  if (DEMO_MODE) seedDemoConversation();
</script>
</body>
</html>
